<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F19;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:0.2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Studio Grid -->
  <path d="M 0 125 L 800 125 M 0 250 L 800 250 M 0 375 L 800 375" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,8" opacity="0.4"/>
  <path d="M 200 0 L 200 500 M 400 0 L 400 500 M 600 0 L 600 500" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,8" opacity="0.4"/>

  <!-- Center Card Badge -->
  <g transform="translate(400, 240)">
    <rect x="-180" y="-80" width="360" height="160" rx="16" fill="#0F172A" stroke="url(#borderGrad)" stroke-width="1.5"/>
    
    <!-- Camera Icon -->
    <path d="M -24 -20 L -14 -34 L 14 -34 L 24 -20 L 36 -20 C 42 -20, 46 -16, 46 -10 L 46 26 C 46 32, 42 36, 36 36 L -36 36 C -42 36, -46 32, -46 26 L -46 -10 C -46 -16, -42 -20, -36 -20 Z" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="8" r="16" fill="none" stroke="#64748B" stroke-width="2.5"/>
    <circle cx="0" cy="8" r="6" fill="#475569"/>

    <text x="0" y="58" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#94A3B8" letter-spacing="1.5">IMAGE ASSET REQUIRED</text>
  </g>

  <!-- Bottom Notice -->
  <text x="400" y="440" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#475569" letter-spacing="0.8">CAR DELIGHTS AUTOMOTIVE PHOTOGRAPHY ARCHIVE</text>
</svg>
